<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeuanganKu</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="CSS/style.css">

    <link rel="icon" href="data:,">

</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-wallet2"></i>
                KeuanganKu
            </a>
        </div>
    </nav>

    <!-- Container -->
    <div class="container mt-4">

        <!-- Judul -->
        <div class="mb-4">
            <h2>Dashboard</h2>
            <p class="text-muted">
                Kelola pemasukan dan pengeluaranmu dengan mudah.
            </p>
        </div>

        <!-- Card Statistik -->
        <div class="row g-4">

            <!-- Saldo -->
            <div class="col-md-3">
                <div class="card shadow border-0">
                    <div class="card-body">

                        <i class="bi bi-wallet2 fs-1 text-primary"></i>

                        <h6 class="mt-3">Total Saldo</h6>

                        <h3 id="saldo">
                            Rp 0
                        </h3>

                    </div>
                </div>
            </div>

            <!-- Income -->
            <div class="col-md-3">
                <div class="card shadow border-0">
                    <div class="card-body">

                        <i class="bi bi-arrow-down-circle fs-1 text-success"></i>

                        <h6 class="mt-3">Total Income</h6>

                        <h3 id="income">
                            Rp 0
                        </h3>

                    </div>
                </div>
            </div>

            <!-- Outcome -->
            <div class="col-md-3">
                <div class="card shadow border-0">
                    <div class="card-body">

                        <i class="bi bi-arrow-up-circle fs-1 text-danger"></i>

                        <h6 class="mt-3">Total Outcome</h6>

                        <h3 id="outcome">
                            Rp 0
                        </h3>

                    </div>
                </div>
            </div>

            <!-- Jumlah -->
            <div class="col-md-3">
                <div class="card shadow border-0">
                    <div class="card-body">

                        <i class="bi bi-list-check fs-1 text-warning"></i>

                        <h6 class="mt-3">Transaksi</h6>

                        <h3 id="jumlah">
                            0
                        </h3>

                    </div>
                </div>
            </div>

        </div>

    </div>

<!-- Form Tambah Transaksi -->
    <div class="card shadow border-0 mt-5">

        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">
                <i class="bi bi-plus-circle"></i>
                Tambah Transaksi
            </h5>
        </div>

        <div class="card-body">

            <div class="row">

                <!-- Jenis -->
                <div class="col-md-3 mb-3">
                    <label class="form-label">Jenis</label>

                    <select class="form-select" id="jenis">
                        <option value="">Pilih Jenis</option>
                        <option value="income">Income</option>
                        <option value="outcome">Outcome</option>
                    </select>
                </div>

                <!-- Kategori -->
                <div class="col-md-3 mb-3">
                    <label class="form-label">Kategori</label>

                    <select class="form-select" id="kategori">

                        <option>Makanan</option>
                        <option>Transportasi</option>
                        <option>Belanja</option>
                        <option>Gaji</option>
                        <option>Bonus</option>
                        <option>Hiburan</option>
                        <option>Lainnya</option>

                    </select>
                </div>

                <!-- Nominal -->
                <div class="col-md-3 mb-3">

                    <label class="form-label">
                        Nominal
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="nominal"
                        placeholder="Masukkan nominal">

                </div>

                <!-- Tanggal -->
                <div class="col-md-3 mb-3">

                    <label class="form-label">
                        Tanggal
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        id="tanggal">

                </div>

            </div>

            <!-- Catatan -->

            <div class="mb-3">

                <label class="form-label">
                    Catatan
                </label>

                <textarea
                    class="form-control"
                    rows="3"
                    id="catatan"
                    placeholder="Contoh : Makan siang bersama teman">
                </textarea>

            </div>

            <button
                class="btn btn-success"
                id="btnTambah">

                <i class="bi bi-check-circle"></i>

                Tambah Transaksi

            </button>

        </div>

    </div>
<!-- Riwayat Transaksi -->
    <div class="card shadow border-0 mt-5">

        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">
                <i class="bi bi-clock-history"></i>
                Riwayat Transaksi
            </h5>
        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">

                        <tr>

                            <th>No</th>
                            <th>Tanggal</th>
                            <th>Jenis</th>
                            <th>Kategori</th>
                            <th>Catatan</th>
                            <th>Nominal</th>
                            <th>Aksi</th>

                        </tr>

                    </thead>

                    <tbody id="dataTransaksi">

                        <tr>

                            <td colspan="7" class="text-center text-muted">

                                Belum ada transaksi

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="JS/data.js"></script>
<script src="JS/storage.js"></script>
<script src="JS/chart.js"></script>
<script src="JS/app.js"></script>


</body>
</html>
